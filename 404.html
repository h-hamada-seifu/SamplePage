<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません ｜ 鶏白湯そば 灯 -AKARI-</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
  <!--
    404 ページはどの階層の URL でも表示されるため、相対パスの css/style.css が読めない。
    そのためスタイルはこのファイル内で完結させている。
  -->
  <style>
    :root {
      --ink: #0f0e0d;
      --shu: #c8322a;
      --shu-light: #e2553f;
      --cream: #f2ead9;
      --muted: #9a9184;
      --gold: #b89a5e;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 16px;
      background: radial-gradient(circle at 50% 40%, rgba(200, 50, 42, 0.18), transparent 55%), var(--ink);
      color: var(--cream);
      font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
      letter-spacing: 0.04em;
      text-align: center;
      overflow: hidden;
    }
    .bg {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: min(56vw, 560px);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(242, 234, 217, 0.08);
      pointer-events: none;
      user-select: none;
    }
    main { position: relative; }
    .bowl {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 40px;
      border-radius: 50%;
      background:
        radial-gradient(circle closest-side, #0b0a09 0 72%, transparent 73%),
        radial-gradient(circle closest-side, transparent 0 75%, #0b0a09 75% 80%, var(--shu) 80% 83%, #0b0a09 83% 87%, #1e1b18 87% 99%, transparent 100%);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55);
      animation: in 1.2s var(--ease) both;
    }
    /* 空っぽの器 ＝ 売り切れ */
    .bowl::after {
      content: "完売";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: "Shippori Mincho B1", serif;
      font-weight: 800;
      font-size: 34px;
      color: var(--shu-light);
      transform: rotate(-12deg);
      animation: stamp 0.7s var(--ease) 0.6s both;
    }
    .en {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      letter-spacing: 0.3em;
      color: var(--gold);
      animation: up 1s var(--ease) 0.8s both;
    }
    h1 {
      margin: 12px 0 20px;
      font-family: "Shippori Mincho B1", serif;
      font-weight: 700;
      font-size: clamp(26px, 5vw, 40px);
      letter-spacing: 0.1em;
      line-height: 1.5;
      animation: up 1s var(--ease) 0.9s both;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.9;
      animation: up 1s var(--ease) 1s both;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-top: 40px;
      padding: 16px 36px;
      border: 1px solid var(--shu);
      border-radius: 999px;
      background: var(--shu);
      color: var(--cream);
      font-size: 14px;
      letter-spacing: 0.16em;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.4s var(--ease), color 0.4s;
      animation: up 1s var(--ease) 1.1s both;
    }
    .btn:hover { background: var(--cream); color: var(--ink); }
    @keyframes in { from { opacity: 0; transform: scale(0.8) rotate(-30deg); } }
    @keyframes stamp { from { opacity: 0; transform: scale(2.2) rotate(-24deg); } }
    @keyframes up { from { opacity: 0; transform: translateY(16px); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">404</div>
  <main>
    <div class="bowl" aria-hidden="true"></div>
    <p class="en">Page Not Found</p>
    <h1>お探しのページは<br>売り切れのようです。</h1>
    <p>URL が変更されたか、ページが削除された可能性があります。</p>
    <a class="btn" id="home-link" href="/">トップへ戻る <span aria-hidden="true">→</span></a>
  </main>
  <script>
    // GitHub Pages（/リポジトリ名/ 配下）と Vercel（ルート直下）の両方でトップへ戻れるようにする
    (() => {
      if (!location.hostname.endsWith('github.io')) return;
      const repo = location.pathname.split('/')[1];
      if (repo) document.getElementById('home-link').href = '/' + repo + '/';
    })();
  </script>
</body>
</html>
